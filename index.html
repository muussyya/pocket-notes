    { id: 'home', label: 'ホーム', ab: 'Sheet1' },
    { id: 'typing', label: 'タイピング', ab: 'Sheet2' },
    { id: 'excel', label: 'Excel', ab: 'Sheet3' },
    { id: 'keys', label: 'ショートカット', ab: 'Sheet4' },
    { id: 'quiz', label: 'クイズ', ab: 'Sheet5' },
  ];
  const tabsEl = document.getElementById('tabs');
  TABS.forEach((t) => tabsEl.append(h('a', { class: 'tab', href: '#' + t.id, 'data-tab': t.id }, h('span', { class: 'ab' }, t.ab), t.label)));
  const setHead = (tab, crumb, cell) => {
    document.getElementById('crumb').textContent = crumb;
    document.getElementById('namebox').textContent = cell;
    tabsEl.querySelectorAll('.tab').forEach((a) => (a.dataset.tab === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  };
  const go = (hash) => { if (location.hash === '#' + hash) route(); else location.hash = hash; };

  function route() {
    const hash = location.hash.slice(1) || 'home';
    app.textContent = '';
    window.scrollTo(0, 0);
    let m;
    if (hash === 'typing') viewTyping();
    else if (hash === 'finger-quiz') viewFingerQuiz();
    else if (hash === 'excel') viewExcel();
    else if ((m = hash.match(/^stage-(\d+)$/))) viewStage(+m[1]);
    else if ((m = hash.match(/^lesson-([a-z0-9-]+)$/))) viewLesson(m[1].replace(/-/g, '_'));
    else if (hash === 'keys') viewKeys();
    else if (hash === 'quiz') viewQuiz();
    else viewHome();
  }
  window.addEventListener('hashchange', route);

  // ---- ホーム ----
  function nextLesson() {
    for (const s of D.stages) for (const t of s.tasks) if (t.lesson.length && !store.read[t.id]) return t;
    return null;
  }
  function viewHome() {
    setHead('home', 'ホーム', 'A1');
    const nl = nextLesson();
    const quizDone = Object.keys(store.quiz).length;
    const page = h('section', { class: 'page' },
      h('div', { class: 'stack' },
        h('p', { class: 'eyebrow' }, 'すきま時間の予習帳'),
        h('h1', null, 'ポケット基礎ノート'),
        h('p', { class: 'lead' }, 'パソコンに向かう前に、スマホで基礎を読んでおくためのノートです。'
          + 'Excel課題の解説と同じ内容を、1つ3分ほどで読めます。読んだ記録は、この端末のブラウザに残ります。')),
      nl ? h('div', { class: 'next' },
        h('p', { class: 'eyebrow' }, '次に読む'),
        h('h3', null, nl.title),
        h('p', { class: 'note' }, `第${nl.stage}段階 ${D.stages.find((s) => s.id === nl.stage).title}`),
        h('a', { class: 'btn primary', href: '#lesson-' + nl.id.replace(/_/g, '-') }, '読む'))
        : h('div', { class: 'next' }, h('h3', null, 'Excelの解説はすべて読みました'), h('p', { class: 'note' }, 'クイズとショートカットで、覚えたかを確かめましょう。')),
      h('div', { class: 'tiles' },
        tile('#typing', 'B2', 'タイピングの基本', '姿勢、ホームポジション、指の担当。指当てクイズ付き。'),
        tile('#excel', 'C2', 'Excelの読みもの', `読んだ解説 ${lessonsRead()} / ${lessonsTotal}`),
        tile('#keys', 'D2', 'ショートカット', `覚えた ${knownCount()} / ${D.shortcuts.length}`),
        tile('#quiz', 'E2', '基礎の4択クイズ', quizDone ? `挑戦した分野 ${quizDone} / ${D.topics.length}` : `${D.quiz.length}問・分野ごとに挑戦`)),
      h('div', { class: 'stack' },
        h('h3', null, 'おすすめの使い方'),
        h('div', { class: 'list' },
          step('1', '通勤や休憩に1つ読む', '「次に読む」の解説を1つ。例の表を目で追って、数式の形をつかみます。'),
          step('2', '寝る前に5分', 'ショートカットのカードを10枚、または4択クイズを1回。'),
          step('3', 'パソコンで手を動かす', '読んだ課題を、ツールで実際に解きます。読むだけでは身につきません。')))
    );
    app.append(page);
  }
  const tile = (href, addr, title, sub) => h('a', { class: 'tile', href }, h('span', { class: 'addr' }, addr), h('b', null, title), h('span', null, sub));
  const step = (no, title, sub) => h('div', { class: 'row' }, h('span', { class: 'no' }, no), h('span', { class: 't' }, h('b', null, title), h('span', null, sub)), h('span'));

  // ---- タイピング ----
  function keyboard() {
    const kb = h('div', { class: 'kb', role: 'img', 'aria-label': '指の担当ごとに色分けしたキーボード' });
    D.keyboard.forEach((row, ri) => {
      const r = h('div', { class: 'r', style: `padding-left:${[0, 14, 22, 36][ri]}px` });
      row.forEach(([label, f]) => r.append(h('span', { class: `k f${f}${'ASDFJKL;'.includes(label) ? ' home' : ''}` }, label)));
      kb.append(r);
    });
    const legend = h('div', { class: 'legend' });
    [0, 1, 2, 3, 5, 6, 7, 8].forEach((f) => legend.append(h('span', null, h('i', { class: 'f' + f }), FINGERS[f])));
    return h('div', { class: 'stack' }, kb, legend);
  }
  function viewTyping() {
    setHead('typing', 'タイピングの基本', 'B2');
    const page = h('section', { class: 'page' },
      h('div', { class: 'stack' }, h('p', { class: 'eyebrow' }, 'Sheet2'), h('h1', null, 'タイピングの基本'),
        h('p', { class: 'lead' }, 'キーボードを見ずに打つ「ブラインドタッチ」の考え方です。練習はパソコンのツールで行います。')));
    D.typing.forEach((s, i) => {
      const sec = h('div', { class: 'stack' }, h('h2', null, `${i + 1}. ${s.title}`), h('div', { class: 'lesson' }, s.points.map((p) => h('p', null, p))));
      if (s.title.includes('担当指')) sec.append(keyboard());
      page.append(sec);
    });
    page.append(h('div', { class: 'next' },
      h('h3', null, '指の担当を覚えたか確かめる'),
      h('p', { class: 'note' }, 'キーが1つ出るので、打つ指を選びます。10問です。'),
      h('a', { class: 'btn primary', href: '#finger-quiz' }, '指当てクイズ')));
    app.append(page);
  }
  function viewFingerQuiz() {
    setHead('typing', '指当てクイズ', 'B3');
    const pool = [];
    D.keyboard.forEach((row) => row.forEach(([label, f]) => { if (/^[A-Z;,./]$/.test(label)) pool.push([label, f]); }));
    const qs = shuffle(pool).slice(0, 10);
    let i = 0; let ok = 0;
    const page = h('section', { class: 'page' });
    app.append(page);
    const show = () => {
      page.textContent = '';
      if (i >= qs.length) {
        page.append(h('div', { class: 'card' }, h('p', { class: 'eyebrow' }, '結果'), h('div', { class: 'score' }, `${ok} / ${qs.length}`),
          h('p', null, ok >= 9 ? 'よく覚えています。パソコンの練習でも、この指で打ちましょう。' : '色の付いたキーボードの図を見直してから、もう一度挑戦しましょう。'),
          h('div', { class: 'btns' }, h('button', { class: 'btn primary', type: 'button', onclick: () => go('finger-quiz') }, 'もう一度'),
            h('a', { class: 'btn', href: '#typing' }, '図を見直す'))));
        return;
      }
      const [label, f] = qs[i];
      const fb = h('div', { class: 'feedback', hidden: true });
      const grid = h('div', { class: 'fingers' });
      let done = false;
      [0, 1, 2, 3, 5, 6, 7, 8].forEach((c) => grid.append(h('button', {
        class: 'choice', type: 'button', onclick: (e) => {
          if (done) return; done = true;
          if (c === f) { ok++; e.currentTarget.classList.add('right'); fb.append(h('b', null, '正解'), '　', FINGERS[f], 'で打ちます。'); } else {
            e.currentTarget.classList.add('wrong');
            grid.children[[0, 1, 2, 3, 5, 6, 7, 8].indexOf(f)].classList.add('right');
            fb.append(h('b', { class: 'no' }, '惜しい'), '　正解は', FINGERS[f], 'です。');
          }
          fb.hidden = false;
          next.hidden = false;
        },
      }, FINGERS[c])));
      const next = h('button', { class: 'btn primary', type: 'button', hidden: true, onclick: () => { i++; show(); } }, i + 1 < qs.length ? '次へ' : '結果を見る');
      page.append(h('div', { class: 'card' }, h('p', { class: 'eyebrow' }, `${i + 1} / ${qs.length}`), h('p', { class: 'q' }, 'このキーは、どの指で打ちますか？'),
        h('div', { class: 'bigkey' }, label), grid, fb, next));
    };
    show();
  }

  // ---- Excel の読みもの ----
  function viewExcel() {
    setHead('excel', 'Excelの読みもの', 'C2');
    const page = h('section', { class: 'page' },
      h('div', { class: 'stack' }, h('p', { class: 'eyebrow' }, 'Sheet3'), h('h1', null, 'Excelの読みもの'),
        h('p', { class: 'lead' }, 'ツールのExcel課題と同じ順番です。第0段階から順に読むと、そのまま課題につながります。')));
    const list = h('div', { class: 'list' });
    D.stages.forEach((s) => {
      const ts = s.tasks.filter((t) => t.lesson.length);
      const n = ts.filter((t) => store.read[t.id]).length;
      list.append(h('a', { class: `row${ts.length && n === ts.length ? ' done' : ''}`, href: '#stage-' + s.id },
        h('span', { class: 'no' }, s.id), h('span', { class: 't' }, h('b', null, s.title), h('span', null, s.desc)),
        h('span', { class: 'mark' }, ts.length ? `${n}/${ts.length}` : 'テスト')));
    });
    page.append(list);
    app.append(page);
  }
  function viewStage(id) {
    const s = D.stages.find((x) => x.id === id);
    if (!s) return viewExcel();
    setHead('excel', `第${s.id}段階 ${s.title}`, `C${s.id + 3}`);
    const page = h('section', { class: 'page' },
      h('a', { class: 'note', href: '#excel' }, '← 段階の一覧'),
      h('div', { class: 'stack' }, h('p', { class: 'eyebrow' }, `第${s.id}段階`), h('h1', null, s.title), h('p', { class: 'lead' }, s.desc)));
    const list = h('div', { class: 'list' });
    s.tasks.forEach((t, i) => {
      if (!t.lesson.length) {
        list.append(h('div', { class: 'row' }, h('span', { class: 'no' }, 'テ'), h('span', { class: 't' }, h('b', null, t.title),
          h('span', null, `パソコンで解く確認テストです${t.limit_min ? `（制限時間 ${t.limit_min}分）` : ''}。解説はありません。`)), h('span')));
        return;
      }
      list.append(h('a', { class: `row${store.read[t.id] ? ' done' : ''}`, href: '#lesson-' + t.id.replace(/_/g, '-') },
        h('span', { class: 'no' }, store.read[t.id] ? '✓' : i + 1), h('span', { class: 't' }, h('b', null, t.title), h('span', null, t.summary)), h('span')));
    });
    page.append(list);
    app.append(page);
  }
  function sheetBlock(sh) {
    const rows = sh.rows || [];
    const cols = Math.max(...rows.map((r) => r.length), 1);
    const table = h('table', { class: 'cells' });
    const head = h('tr', null, h('th', null, ''));
    for (let c = 0; c < cols; c++) head.append(h('th', null, colName(c)));
    table.append(head);
    rows.forEach((r, ri) => {
      const tr = h('tr', null, h('th', null, ri + 1));
      for (let c = 0; c < cols; c++) {
        const v = r[c];
        const isF = typeof v === 'string' && v.startsWith('=');
        tr.append(h('td', { class: isF ? 'f' : (typeof v === 'number' ? 'num' : null) }, v == null ? '' : fmtNum(v)));
      }
      table.append(tr);
    });
    return h('div', { class: 'sheet' }, h('div', { class: 'grid-scroll' }, table), sh.note ? h('p', { class: 'note' }, sh.note) : null);
  }
  function viewLesson(id) {
    let task = null; let stage = null;
    for (const s of D.stages) for (const t of s.tasks) if (t.id === id) { task = t; stage = s; }
    if (!task) return viewExcel();
    setHead('excel', task.title, `C${stage.id + 3}`);
    const ts = stage.tasks.filter((t) => t.lesson.length);
    const idx = ts.indexOf(task);
    const nxt = ts[idx + 1] || null;
    const body = h('div', { class: 'lesson' });
    task.lesson.forEach((b) => {
      if (b.p) body.append(h('p', null, b.p));
      else if (b.tip) body.append(h('p', { class: 'tip' }, b.tip));
      else if (b.ex) body.append(h('div', { class: 'ex' }, h('code', null, b.ex[0]), h('span', null, b.ex[1])));
      else if (b.sheet) body.append(sheetBlock(b.sheet));
    });
    const hints = h('div', { class: 'hint-box' }, h('h3', null, '課題のヒント'),
      h('p', { class: 'note' }, 'パソコンで課題を解くときに出るヒントです。考えてから1つずつ開きます。'),
      ...task.hints.map((t, i) => h('details', null, h('summary', null, ['考え方', '使う機能・関数', '数式や操作の形'][i] || `ヒント${i + 1}`), h('div', null, t))));
    const mark = h('button', { class: 'btn primary', type: 'button', onclick: () => {
      store.read[task.id] = Date.now(); store.last = task.id; save();
      go(nxt ? 'lesson-' + nxt.id.replace(/_/g, '-') : 'stage-' + stage.id);
    } }, nxt ? '読んだ・次へ' : '読んだ・一覧へ');
    const page = h('section', { class: 'page' },
      h('a', { class: 'note', href: '#stage-' + stage.id }, `← 第${stage.id}段階 ${stage.title}`),
      h('div', { class: 'stack' }, h('p', { class: 'eyebrow' }, `第${stage.id}段階・${idx + 1} / ${ts.length}${store.read[task.id] ? '・読みました' : ''}`),
        h('h1', null, task.title), h('p', { class: 'lead' }, task.summary)),
      body, task.hints.length ? hints : null,
      h('div', { class: 'btns' }, mark));
    app.append(page);
  }

  // ---- ショートカットの暗記カード ----
  let keySet = 'k1';
  try { keySet = sessionStorage.getItem(KEY + '-set') || 'k1'; } catch (e) { keySet = 'k1'; }
  function caps(label) {
    const wrap = h('div', { class: 'keycaps' });
    label.split(' + ').forEach((k, i) => { if (i) wrap.append(h('span', { class: 'plus' }, '+')); wrap.append(h('span', { class: 'cap' }, k)); });
    return wrap;
  }
  function viewKeys() {
    setHead('keys', 'ショートカット', 'D2');
    const page = h('section', { class: 'page' },
      h('div', { class: 'stack' }, h('p', { class: 'eyebrow' }, 'Sheet4'), h('h1', null, 'ショートカットの暗記カード'),
        h('p', { class: 'lead' }, '操作の説明を見て、押すキーを思い浮かべてから「答えを見る」を押します。実際に押す練習は、パソコンのツールで行います。')));
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'ショートカットのセット' });
    D.sets.forEach((s) => {
      const n = D.shortcuts.filter((c) => c.set === s.id).length;
      const k = D.shortcuts.filter((c) => c.set === s.id && store.known[c.id]).length;
      chips.append(h('button', { class: 'chip', type: 'button', 'aria-pressed': String(s.id === keySet), onclick: () => {
        keySet = s.id; try { sessionStorage.setItem(KEY + '-set', keySet); } catch (e) { /* 無視 */ } route();
      } }, `${s.title}（${k}/${n}）`));
    });
    page.append(chips);
    const deck = shuffle(D.shortcuts.filter((c) => c.set === keySet && !store.known[c.id]))
      .concat(shuffle(D.shortcuts.filter((c) => c.set === keySet && store.known[c.id])));
    const area = h('div', { class: 'stack' });
    page.append(area);
    let i = 0;
    const show = () => {
      area.textContent = '';
      const set = D.sets.find((s) => s.id === keySet);
      const total = deck.length;
      const k = deck.filter((c) => store.known[c.id]).length;
      area.append(h('div', { class: 'meter', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': k }, h('i', { style: `width:${total ? (k / total) * 100 : 0}%` })));
      if (i >= total) {
        area.append(h('div', { class: 'card' }, h('h3', null, `「${set.title}」を1周しました`), h('p', null, `覚えた ${k} / ${total}`),
          h('div', { class: 'btns' }, h('button', { class: 'btn primary', type: 'button', onclick: () => route() }, 'もう1周'))));
        return;
      }
      const c = deck[i];
      const back = h('div', { class: 'stack', hidden: true }, caps(c.label), c.note ? h('p', { class: 'note' }, c.note) : null,
        h('div', { class: 'btns' },
          h('button', { class: 'btn', type: 'button', onclick: () => { delete store.known[c.id]; save(); i++; show(); } }, 'まだ'),
          h('button', { class: 'btn primary', type: 'button', onclick: () => { store.known[c.id] = Date.now(); save(); i++; show(); } }, '覚えた')));
      const reveal = h('button', { class: 'btn primary', type: 'button', onclick: () => { back.hidden = false; reveal.hidden = true; } }, '答えを見る');
      area.append(h('div', { class: 'card' }, h('p', { class: 'eyebrow' }, `${i + 1} / ${total}${store.known[c.id] ? '・覚えた' : ''}`),
        h('p', { class: 'q' }, c.desc), reveal, back));
    };
    show();
    app.append(page);
  }

  // ---- 4択クイズ ----
  function viewQuiz() {
    setHead('quiz', '基礎の4択クイズ', 'E2');
    const page = h('section', { class: 'page' },
      h('div', { class: 'stack' }, h('p', { class: 'eyebrow' }, 'Sheet5'), h('h1', null, '基礎の4択クイズ'),
        h('p', { class: 'lead' }, '全分野からまぜると10問、分野を選ぶとその分野の全問が出ます。答えるたびに解説が出ます。')));
    const list = h('div', { class: 'list' });
    list.append(h('button', { class: 'row', type: 'button', onclick: () => runQuiz(null, page) },
      h('span', { class: 'no' }, '∑'), h('span', { class: 't' }, h('b', null, '全分野からまぜて'), h('span', null, `${D.quiz.length}問から10問`)), h('span')));
    D.topics.forEach((t, i) => {
      const best = store.quiz[t];
      const n = D.quiz.filter((q) => q.topic === t).length;
      list.append(h('button', { class: `row${best === n ? ' done' : ''}`, type: 'button', onclick: () => runQuiz(t, page) },
        h('span', { class: 'no' }, i + 1), h('span', { class: 't' }, h('b', null, t), h('span', null, `${n}問`)),
        h('span', { class: 'mark' }, best != null ? `最高 ${best}/${n}` : '')));
    });
    page.append(list);
    app.append(page);
  }
  function runQuiz(topic, page) {
    const pool = topic ? D.quiz.filter((q) => q.topic === topic) : D.quiz;
    const qs = shuffle(pool).slice(0, 10);
    let i = 0; let ok = 0;
    const show = () => {
      page.textContent = '';
      window.scrollTo(0, 0);
      if (i >= qs.length) {
        if (topic) { store.quiz[topic] = Math.max(store.quiz[topic] || 0, ok); save(); }
        page.append(h('div', { class: 'card' }, h('p', { class: 'eyebrow' }, topic || '全分野'), h('div', { class: 'score' }, `${ok} / ${qs.length}`),
          h('p', null, ok === qs.length ? '全問正解です。' : '間違えた問題の解説を、パソコンで課題を解く前にもう一度読みましょう。'),
          h('div', { class: 'btns' }, h('button', { class: 'btn primary', type: 'button', onclick: () => runQuiz(topic, page) }, 'もう一度'),
            h('button', { class: 'btn', type: 'button', onclick: () => route() }, '分野の一覧'))));
        return;
      }
      const q = qs[i];
      const order = shuffle([0, 1, 2, 3]);
      const fb = h('div', { class: 'feedback', hidden: true });
      const box = h('div', { class: 'choices' });
      let done = false;
      order.forEach((ci) => box.append(h('button', { class: 'choice', type: 'button', 'data-ci': ci, onclick: (e) => {
        if (done) return; done = true;
        if (ci === q.answer) { ok++; e.currentTarget.classList.add('right'); fb.append(h('b', null, '正解　')); } else {
          e.currentTarget.classList.add('wrong');
          box.querySelector(`[data-ci="${q.answer}"]`).classList.add('right');
          fb.append(h('b', { class: 'no' }, '不正解　'));
        }
        fb.append(q.explain);
        fb.hidden = false; nx.hidden = false;
        nx.focus();
      } }, q.choices[ci])));
      const nx = h('button', { class: 'btn primary', type: 'button', hidden: true, onclick: () => { i++; show(); } }, i + 1 < qs.length ? '次へ' : '結果を見る');
      page.append(h('div', { class: 'card' }, h('p', { class: 'eyebrow' }, `${q.topic}・${i + 1} / ${qs.length}`), h('p', { class: 'q' }, q.q), box, fb, nx));
    };
    show();
  }

  route();

  // アプリ版（GitHub Pages で配信し、ホーム画面に追加したもの）だけ、オフラインでも開けるようにする
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* 登録できなくてもページは動く */ }));
  }
})();
</script>
</body>
</html>
